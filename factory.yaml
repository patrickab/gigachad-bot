profile: gigachad
# Tests and previews run on the main checkout's virtualenv (`{repo_path}`, the engine fills it in), the sandbox profile mounts it at the same path.
# Worktrees get frontend packages only: `uv sync` per worktree would carry a second venv (and the OCR group) around.
hooks:
  after_create:
    - [npm, ci, --prefix, src/frontend, --ignore-scripts, --prefer-offline, --no-audit, --no-fund]
    - [bun, install, --cwd, pi-host, --frozen-lockfile]
  after_code: []
  before_remove: []
# The pipeline of scripts/check.sh, one gate per step so a failure names it. The script is hermetic (env -i) and gives the
# Postgres-backed tests a throwaway database, so a gate fails only for the task's own change.
gates:
  - [bash, scripts/check.sh, lint]
  - [bash, scripts/check.sh, types]
  - [bash, scripts/check.sh, frontend]
  - [bash, scripts/check.sh, pi-host]
  - [bash, scripts/check.sh, python]
# The browser reaches a preview only through the preview gate (`src/backend/preview_gate.py`), which picks it by the port in
# the path: the frontend is served under `/preview/<port>`, its API base is the gate path of the backend (a path, resolved
# against the gate's origin in the browser). Both processes listen on loopback only, they run agent-written code.
preview:
  processes:
    - name: backend
      argv: ["{repo_path}/.venv/bin/python3", -m, uvicorn, src.backend.server:app, --host, 127.0.0.1, --port, "{port.backend}"]
      ready_url: "http://127.0.0.1:{port.backend}/healthz"
    - name: frontend
      argv: [npm, --prefix, src/frontend, exec, --, next, dev, --webpack, -H, 127.0.0.1, -p, "{port.frontend}", src/frontend]
      ready_url: "http://127.0.0.1:{port.frontend}/preview/{port.frontend}"
  env:
    GIGACHAD_ENV: development
    GIGACHAD_DEV_USER: factory-preview
    GIGACHAD_DATABASE_URL: "{database_url}"
    GIGACHAD_BASE_DIR: "{data_dir}"
    NEXT_PUBLIC_BASE_PATH: "/preview/{port.frontend}"
    NEXT_PUBLIC_API_BASE: "/preview-api/{port.backend}/api"
  database: true
  url: "http://127.0.0.1:{port.frontend}/preview/{port.frontend}"
  api_url: "http://127.0.0.1:{port.backend}/api"
  ready_timeout_s: 180
