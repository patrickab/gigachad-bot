# What the agent factory needs to know about this repo: hooks, gates, protected paths and the preview. Per-repo settings
# (merge, rounds, models) live in gigachad's database. `{repo_path}` is the main checkout, filled in by the reader.
#
# A task's worktree comes from `agent-worktree`: an overlay venv on the main checkout's `.venv` and a copy-on-write
# `node_modules` for `src/frontend` and `pi-host`. So `after_create` has nothing to install, and tests and previews of a
# worktree run on the main checkout's packages.
hooks:
  after_create: []
  after_code: []
  # Run in the main checkout after a merge that changed a lockfile, so its packages (the ones every worktree shares or
  # copies) match the merged lockfiles. Never run `uv sync` in a worktree: it would rebuild the overlay as a full venv.
  # The dev servers may be running from that checkout, so every command installs in place: no `npm ci`, which deletes
  # `node_modules` first. `--no-save` keeps npm from writing `package-lock.json`.
  after_merge:
    - [uv, sync, --locked]
    - [npm, install, --prefix, src/frontend, --no-save, --ignore-scripts, --prefer-offline, --no-audit, --no-fund]
    - [bun, install, --cwd, pi-host, --frozen-lockfile]
# After every coder turn only the quick checks (lint, types) of what the change reaches. The tests run once, in the
# merge queue: on the branch rebased onto the target, one task of the repo at a time, before the fast-forward.
# --reuse skips a step that passed on the same tree: a merge whose rebase moved nothing repeats no lint or types.
# scripts/check.sh is hermetic (env -i), runs its steps in parallel and names the failed ones in its last lines. Exit 75
# means a broken environment (missing packages or tools): the factory blocks the task as `infra` instead of a round.
gates:
  - [bash, scripts/check.sh, --changed, --reuse, lint, types]
merge_gates:
  - [bash, scripts/check.sh, --changed, --reuse]
# The browser reaches a preview only through the preview gate (`src/backend/preview_gate.py`), which picks it by the port in
# the path: the frontend is served under `/preview/<port>`, its API base is the gate path of the backend (a path, resolved
# against the gate's origin in the browser). Both processes listen on loopback only, they run agent-written code.
preview:
  processes:
    - name: backend
      argv: ["{repo_path}/.venv/bin/python3", -m, uvicorn, src.backend.server:app, --host, 127.0.0.1, --port, "{port.backend}"]
      ready_url: "http://127.0.0.1:{port.backend}/healthz"
    - name: frontend
      argv: [npm, --prefix, src/frontend, exec, --, next, dev, --turbopack, -H, 127.0.0.1, -p, "{port.frontend}", src/frontend]
      ready_url: "http://127.0.0.1:{port.frontend}/preview/{port.frontend}"
  env:
    GIGACHAD_ENV: development
    GIGACHAD_DEV_USER: factory-preview
    GIGACHAD_DATABASE_URL: "{database_url}"
    GIGACHAD_BASE_DIR: "{data_dir}"
    NEXT_PUBLIC_BASE_PATH: "/preview/{port.frontend}"
    NEXT_PUBLIC_API_BASE: "/preview-api/{port.backend}/api"
  database: true
  url: "http://127.0.0.1:{port.frontend}/preview/{port.frontend}"
  ready_timeout_s: 180
