# .github/dependabot.yml
# Every update PR is a supply-chain change: review the lockfile diff before merging.
# The 7-day cooldown matches `exclude-newer` in pyproject.toml and `min-release-age` in .npmrc.

version: 2
updates:

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    reviewers:
      - "patrickab"

  - package-ecosystem: "npm"
    directory: "/src/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    reviewers:
      - "patrickab"

  - package-ecosystem: "npm"
    directory: "/src/c4"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    reviewers:
      - "patrickab"
